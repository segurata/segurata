# GoReleaser configuration, run by .github/workflows/release.yml on v* tags.
# How to release and verify: docs/releasing.md.
version: 2

project_name: segurata

builds:
  - id: segurata
    main: ./cmd/segurata
    binary: segurata
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/segurata/segurata/internal/version.Version={{ .Tag }}
      - -X github.com/segurata/segurata/internal/version.Commit={{ .FullCommit }}
      - -X github.com/segurata/segurata/internal/version.Date={{ .CommitDate }}
    # The commit time instead of the build time, so a rebuild of a tag gives the same bytes.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - ids: [segurata]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - SECURITY.md

# One SPDX SBOM per archive, made by syft (installed by the release workflow). No --enrich: the
# binary has no third-party modules, and enrichment would query the network.
sboms:
  - artifacts: archive
    args: ["$artifact", "--output", "spdx-json=$document"]

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless signature of checksums.txt with the workflow's GitHub OIDC identity. Checksums cover the
# archives and SBOMs, so one signature covers every artifact.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

# A cask, not a formula: GoReleaser deprecated formulas for prebuilt binaries in v2.10.
homebrew_casks:
  - name: segurata
    binaries: [segurata]
    homepage: https://github.com/segurata/segurata
    description: Security audits for the accounts and computers you manage
    repository:
      owner: segurata
      name: homebrew-tap
      branch: main
      # A write deploy key of the tap alone, held by the release environment.
      git:
        url: git@github.com:segurata/homebrew-tap.git
        private_key: '{{ envOrDefault "HOMEBREW_TAP_DEPLOY_KEY" "" }}'
    # No deploy key, no tap update; the rest of the release goes ahead.
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_DEPLOY_KEY" }}auto{{ else }}true{{ end }}'
    commit_msg_template: "segurata {{ .Tag }}"
    caveats: |
      The binary is not notarized by Apple. If macOS refuses to run it, check the release
      signature (https://github.com/segurata/segurata/blob/main/docs/releasing.md)
      and then run:
        xattr -d com.apple.quarantine "$(brew --prefix)/bin/segurata"

# A Scoop manifest for Windows, in segurata/scoop-bucket: `scoop install segurata`, then
# `scoop update segurata`. Scoop checks each archive's SHA-256 against it.
scoops:
  - name: segurata
    homepage: https://github.com/segurata/segurata
    description: Security audits for the accounts and computers you manage
    license: Apache-2.0
    directory: bucket
    repository:
      owner: segurata
      name: scoop-bucket
      branch: main
      # A write deploy key of the bucket alone, held by the release environment.
      git:
        url: git@github.com:segurata/scoop-bucket.git
        private_key: '{{ envOrDefault "SCOOP_BUCKET_DEPLOY_KEY" "" }}'
    # No deploy key, no bucket update; the rest of the release goes ahead.
    skip_upload: '{{ if isEnvSet "SCOOP_BUCKET_DEPLOY_KEY" }}auto{{ else }}true{{ end }}'
    commit_msg_template: "segurata {{ .Tag }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge "

release:
  # Fixed rather than taken from the git remote, so the cask's download URLs always name the public
  # repository.
  github:
    owner: segurata
    name: segurata
  # Tags with a pre-release suffix (v1.2.0-rc.1) become GitHub pre-releases.
  prerelease: auto
