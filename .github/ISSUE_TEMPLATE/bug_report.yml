name: Bug report
description: segurata did something wrong or crashed.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A vulnerability goes through SECURITY.md, not here.
        Never paste secret values, tokens, inventories (`out/`) or real account names: describe
        them or reproduce with fake values.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `segurata version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: macOS 15.5 arm64
    validations:
      required: true
  - type: input
    id: connector
    attributes:
      label: Command and connector
      placeholder: segurata inventory gcp
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: segurata doctor
      description: Output of `segurata doctor --connector <name>`, with account names replaced.
      render: text
