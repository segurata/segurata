name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned by full commit SHA, with the release in a comment; tools by exact
# version (Go tools through the checksum database, gitleaks and ripgrep by SHA-256). Bump them only
# to releases published at least 4 days earlier (see .github/dependabot.yml). setup-go installs the
# toolchain directive of go.mod.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: standard library only
        run: |
          modules="$(go list -m all)"
          if [ "$modules" != "github.com/segurata/segurata" ]; then
            echo "::error::go.mod must not require third-party modules:"
            echo "$modules"
            exit 1
          fi

  staticcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # 2026.2.2 (module v0.8.2); checks in staticcheck.conf. The Windows files are only checked
      # with GOOS=windows.
      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - name: staticcheck
        run: |
          for target in linux/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "== $target"
            GOOS=${target%/*} GOARCH=${target#*/} "$(go env GOPATH)/bin/staticcheck" ./...
          done

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  leak-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the gate scans every commit
          persist-credentials: false
      - uses: ./.github/actions/install-gitleaks
      # Without the owner's identifiers file (kept off GitHub): gitleaks over the tracked files and
      # the history.
      - name: check-public
        run: scripts/check-public.sh --history

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # Golden files and fixtures are compared byte for byte: keep LF on Windows.
      - name: keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # The local-secrets and redact tests that drive a real rg skip without it. Ubuntu's signed
      # archive is the source on Linux and a pinned release on Windows; macOS runs them skipped.
      - name: install ripgrep
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ripgrep
      - if: runner.os == 'Windows'
        uses: ./.github/actions/install-ripgrep
      - name: go test (race)
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: go test (macOS)
        if: runner.os == 'macOS'
        run: go test ./...
      - name: go vet (Windows)
        if: runner.os == 'Windows'
        run: go vet ./...
      - name: go test (Windows)
        if: runner.os == 'Windows'
        env:
          # This hosted runner is a disposable VM. The native test clears its clipboard.
          SEGURATA_TEST_DISPOSABLE_CLIPBOARD: "1"
        run: go test ./...

  # The windows-latest runner account is the built-in Administrator, elevated. This job runs the
  # same tests as a local standard user created for it: not in Administrators, so its token is
  # never split or elevated (medium integrity, no admin privileges), with its own loaded profile,
  # %TEMP% and Credential Manager vault. Start-Process -Credential goes through
  # CreateProcessWithLogonW, an interactive logon (the token holds INTERACTIVE, as a signed-in
  # user's does) with the profile loaded and the runner's window station and desktop granted to
  # the new logon, so the clipboard, Credential Manager and Task Scheduler behave as for a user at
  # the keyboard. A scheduled task (batch logon, session 0, no desktop) would not. The script
  # checks those token properties before it runs anything.
  test-windows-standard-user:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/install-ripgrep
      - name: go test as a standard user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'segurata-std'
          # A random password that lives only in this step: generated here, masked, never written.
          $alphabet = [char[]]'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!#%+-=?@_'
          $bytes = [Security.Cryptography.RandomNumberGenerator]::GetBytes(40)
          $plain = 'Aa1!' + -join ($bytes | ForEach-Object { $alphabet[$_ % $alphabet.Length] })
          Write-Output "::add-mask::$plain"
          # ADSI keeps the password off every command line.
          $computer = [ADSI]"WinNT://$env:COMPUTERNAME,computer"
          $account = $computer.Create('User', $name)
          $account.SetPassword($plain)
          $account.SetInfo()
          $password = ConvertTo-SecureString $plain -AsPlainText -Force
          Remove-Variable plain, bytes
          $users = ([Security.Principal.SecurityIdentifier]'S-1-5-32-545').Translate([Security.Principal.NTAccount]).Value.Split('\')[-1]
          $group = [ADSI]"WinNT://$env:COMPUTERNAME/$users,group"
          if (-not $group.IsMember("WinNT://$env:COMPUTERNAME/$name")) { $group.Add("WinNT://$env:COMPUTERNAME/$name") }
          $sid = ([Security.Principal.NTAccount]"$env:COMPUTERNAME\$name").Translate([Security.Principal.SecurityIdentifier]).Value

          # The user reads the checkout, the Go toolchain and ripgrep, and nothing of the runner's
          # else; its build cache, module cache and temporary files stay in its own profile.
          $go = (Get-Command go).Source
          $rg = (Get-Command rg).Source
          $goroot = (& $go env GOROOT).Trim()
          foreach ($dir in @($env:GITHUB_WORKSPACE, $goroot, (Split-Path $rg))) {
            icacls $dir /grant "*${sid}:(OI)(CI)RX" /Q | Out-Null
            if ($LASTEXITCODE) { throw "icacls $dir failed" }
          }
          $work = Join-Path $env:RUNNER_TEMP 'standard-user'
          New-Item -ItemType Directory -Path $work | Out-Null
          $script = Join-Path $work 'run.ps1'
          # The user's environment comes from its own profile; only PATH is extended.
          @"
          `$ErrorActionPreference = 'Stop'
          `$env:PATH = '$(Split-Path $go);$(Split-Path $rg);' + `$env:PATH
          `$env:GOTOOLCHAIN = 'local'
          # A disposable VM: the native clipboard test clears the clipboard.
          `$env:SEGURATA_TEST_DISPOSABLE_CLIPBOARD = '1'
          `$groups = whoami /groups /fo csv | ConvertFrom-Csv
          whoami /user /groups /priv
          `$checks = [ordered]@{
            'runs as the standard user' = ([Security.Principal.WindowsIdentity]::GetCurrent().User.Value -eq '$sid')
            'not an administrator'      = -not (`$groups | Where-Object SID -eq 'S-1-5-32-544')
            'medium integrity'          = [bool](`$groups | Where-Object SID -eq 'S-1-16-8192')
            'interactive logon'         = [bool](`$groups | Where-Object SID -eq 'S-1-5-4')
            'own profile loaded'        = (Test-Path (Join-Path `$env:USERPROFILE 'NTUSER.DAT')) -and `$env:USERPROFILE -like '*\$name*'
            'temp in the profile'       = `$env:TEMP.StartsWith(`$env:USERPROFILE, 'OrdinalIgnoreCase')
          }
          `$checks.GetEnumerator() | ForEach-Object { '{0}: {1}' -f `$_.Key, `$_.Value }
          if (`$checks.Values -contains `$false) { 'the token is not a standard user''s'; exit 2 }
          & '$go' env GOCACHE GOMODCACHE GOTMPDIR
          & '$go' test ./...
          exit `$LASTEXITCODE
          "@ | Set-Content -Path $script -Encoding utf8

          $out = Join-Path $work 'out.log'
          $err = Join-Path $work 'err.log'
          $credential = [pscredential]::new("$env:COMPUTERNAME\$name", $password)
          $pwsh = (Get-Process -Id $PID).Path
          $p = Start-Process -FilePath $pwsh -ArgumentList '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', $script `
            -Credential $credential -LoadUserProfile -WorkingDirectory $env:GITHUB_WORKSPACE `
            -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          $null = $p.Handle # keeps the handle, so the exit code survives the process
          $finished = $p.WaitForExit(25 * 60 * 1000)
          Get-Content $out
          Get-Content $err
          if (-not $finished) { $p.Kill($true); throw 'go test as the standard user timed out' }
          if ($p.ExitCode -ne 0) { throw "go test as the standard user exited $($p.ExitCode)" }
      - name: remove the standard user
        if: always()
        shell: pwsh
        run: |
          ([ADSI]"WinNT://$env:COMPUTERNAME,computer").Delete('User', 'segurata-std')

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              echo "== $os/$arch"
              GOOS=$os GOARCH=$arch go build -trimpath -o /dev/null ./cmd/segurata
            done
          done
      # The windows-latest job vets and runs the amd64 tests; arm64 gets the same vet, and every test
      # binary must compile for both.
      - name: windows vet and test compile
        env:
          CGO_ENABLED: "0"
        run: |
          for arch in amd64 arm64; do
            echo "== windows/$arch"
            GOOS=windows GOARCH=$arch go vet ./...
            for p in $(go list ./...); do
              GOOS=windows GOARCH=$arch go test -c -o /dev/null "$p"
            done
          done

  python-connectors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        dir: [examples/hibp, plugins/prowler, scripts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The scripts' end-to-end gate tests skip without gitleaks: CI has it.
      - if: matrix.dir == 'scripts'
        uses: ./.github/actions/install-gitleaks
      - name: unittest
        working-directory: ${{ matrix.dir }}
        run: python -m unittest -v
