name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned by full commit SHA, with the release in a comment. Bump them only
# to releases published at least 4 days earlier (see .github/dependabot.yml).

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: standard library only
        run: |
          modules="$(go list -m all)"
          if [ "$modules" != "github.com/segurata/segurata" ]; then
            echo "::error::go.mod must not require third-party modules:"
            echo "$modules"
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # The local-secrets and redact tests that drive a real rg skip without it. Ubuntu's signed
      # archive is the source; macOS runs them skipped.
      - name: install ripgrep
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ripgrep
      - name: go test (race)
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: go test
        if: runner.os != 'Linux'
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              echo "== $os/$arch"
              GOOS=$os GOARCH=$arch go build -trimpath -o /dev/null ./cmd/segurata
            done
          done

  python-connectors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        dir: [examples/hibp, plugins/prowler]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: unittest
        working-directory: ${{ matrix.dir }}
        run: python -m unittest -v
