name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time; never cancel one half-way.
concurrency:
  group: release
  cancel-in-progress: false

# Third-party actions and tools are pinned to exact releases published at least 4 days earlier.
# How to cut a release and verify it: docs/releasing.md.

jobs:
  preflight:
    # The cosign identity, the cask and go install name this public repository.
    if: github.repository == 'segurata/segurata' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-gitleaks
      - run: scripts/check-public.sh --history
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...

  release:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only v* tags may deploy to this environment, which alone holds the tap's deploy key.
    environment: release
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # keyless cosign signature with this workflow's OIDC identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog needs the previous tag
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.2
      # The notes are the version's section of CHANGELOG.md (a pre-release takes its version's):
      # a tag without one fails here rather than publishing a commit list.
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          version="${version%%-*}"
          awk -v v="$version" '$0 == "## [" v "]" {on = 1; next} /^## \[/ {on = 0} /^\[[^]]+\]: / {on = 0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. Without the deploy key the Homebrew cask is built but not pushed.
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

  # Checks the published signature the way docs/releasing.md tells users to.
  verify:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: download checksums and signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --pattern checksums.txt.sigstore.json
      - name: cosign verify-blob
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cosign verify-blob \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle checksums.txt.sigstore.json \
            checksums.txt
